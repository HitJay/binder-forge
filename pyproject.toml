[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binder-forge"
version = "0.1.0"
description = "End-to-end funnel for de novo protein binder design (BindCraft / RFantibody / BoltzGen orchestration)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "biopython",
    "pandas",
    "numpy",
    "scipy",
    "pyyaml",
    "typer",
    "duckdb",
    "scikit-learn",
    "loguru",
    "pydantic",
]

[project.optional-dependencies]
# Rosetta-free 物理打分(默认栈需要)
physics = ["openmm", "openmmforcefields", "freesasa"]
# 可选: Rosetta 增强(pyrosetta 不在 PyPI, 需从 RosettaCommons 获取并遵守授权)
# rosetta = []

[project.scripts]
forge = "binder_forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
